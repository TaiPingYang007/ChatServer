x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  image: chatserver:dev
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - chatserver_net

x-chatserver-common: &chatserver-common
  <<: *app-common
  environment:
    MYSQL_HOST: "${MYSQL_HOST:-host.docker.internal}"
    MYSQL_PORT: "${MYSQL_PORT:-3306}"
    MYSQL_DATABASE: "${MYSQL_DATABASE:-chatserver}"
    MYSQL_USER: "${MYSQL_USER:-chatserver_app}"
    MYSQL_PASSWORD: "${MYSQL_PASSWORD:-chatserver_dev_password}"
    REDIS_HOST: "${REDIS_HOST:-redis}"
    REDIS_PORT: "${REDIS_PORT:-6379}"
    REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_dev_password}"
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  chatserver-1:
    <<: *chatserver-common
    command: ["./bin/ChatServer", "0.0.0.0", "6000"]
    ports:
      - "6000:6000"

  chatserver-2:
    <<: *chatserver-common
    command: ["./bin/ChatServer", "0.0.0.0", "6002"]
    ports:
      - "6002:6002"

  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_dev_password}"
    command:
      [
        "sh",
        "-c",
        "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - chatserver_net

  client:
    <<: *app-common
    profiles: ["client"]
    depends_on:
      nginx:
        condition: service_started
    command: ["./bin/ChatClient", "nginx", "8000"]
    stdin_open: true
    tty: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - chatserver-1
      - chatserver-2
    ports:
      - "8000:8000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - chatserver_net

volumes:
  redis_data:

networks:
  chatserver_net:
